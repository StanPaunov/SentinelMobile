plugins { id 'com.android.application' }
def signingNames = ['SENTINEL_RELEASE_STORE_FILE', 'SENTINEL_RELEASE_STORE_PASSWORD', 'SENTINEL_RELEASE_KEY_ALIAS', 'SENTINEL_RELEASE_KEY_PASSWORD']
def signedRelease = signingNames.every { System.getenv(it) }
android {
    namespace 'com.stanpaunov.sentinelmobile'
    compileSdk 36
    bundle { language { enableSplit = false } }
    defaultConfig {
        applicationId 'com.stanpaunov.sentinelmobile'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'com.stanpaunov.sentinelmobile.SmokeRunner'
    }
    signingConfigs {
        if (System.getenv('SENTINEL_TEST_STORE_FILE')) {
            localTest {
                storeFile file(System.getenv('SENTINEL_TEST_STORE_FILE'))
                storePassword System.getenv('SENTINEL_TEST_STORE_PASSWORD')
                keyAlias 'androiddebugkey'
                keyPassword System.getenv('SENTINEL_TEST_KEY_PASSWORD')
            }
        }
        if (signedRelease) {
            release {
                storeFile file(System.getenv('SENTINEL_RELEASE_STORE_FILE'))
                storePassword System.getenv('SENTINEL_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('SENTINEL_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('SENTINEL_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('SENTINEL_TEST_STORE_FILE')) { signingConfig signingConfigs.localTest } }
        release { if (signedRelease) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
// Never silently present an unsigned build as a release.
gradle.taskGraph.whenReady { graph ->
    if (!signedRelease && graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] }) {
        throw new GradleException('Set all four SENTINEL_RELEASE_* environment variables before building a release.')
    }
}
